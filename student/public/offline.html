<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ee6c33">
  <title>Smart Canteen</title>
  <style>
    body { margin: 0; background: #f7f3ee; color: #342b25; font: 16px system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; }
    main { margin: 24px; padding: 32px; background: white; border: 1px solid #e9dfd5; border-radius: 24px; max-width: 360px; box-shadow: 0 12px 32px #342b2510; text-align: center; }
    h1 { color: #ee6c33; margin-top: 0; }
    button { background: #ee6c33; color: white; border: none; padding: 12px 24px; font-weight: 700; border-radius: 12px; font-size: 16px; cursor: pointer; margin-top: 16px; width: 100%; }
  </style>
  <script src="/offline.js" defer></script>
</head>
<body>
  <main>
    <h1>Smart Canteen</h1>
    <h2>Reconnecting...</h2>
    <p>Tap the button below to reload and connect to the canteen server.</p>
    <button id="retry-connection" type="button">Try again</button>
  </main>
</body>
</html>
