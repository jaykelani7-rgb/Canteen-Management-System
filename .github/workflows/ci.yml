name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.34.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
      - run: pnpm run test:separation
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: canteen_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d canteen_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:ci_ephemeral_only@localhost:5432/canteen_ci
      MESS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci_ephemeral_only@localhost:5432/canteen_ci
      SECRET_KEY: ci_ephemeral_only_signing_secret_not_for_production
      RATE_LIMIT_ENABLED: "false"
      ENABLE_DEMO_DATA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: alembic upgrade head && alembic check
        working-directory: backend
